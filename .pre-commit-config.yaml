repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args:
          - --fix

      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy app
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false