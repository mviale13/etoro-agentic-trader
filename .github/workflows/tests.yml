name: Tests

on:
  push:
    branches:
      - main
      - "agent/**"
  # Every pull request, not only those targeting main. A stacked PR —
  # one whose base is another feature branch — matched no trigger here,
  # so it ran neither the backend suite nor the frontend job. The
  # frontend-only half of a stacked pair therefore got no frontend CI at
  # all, which is exactly the gap the web job was added to close.
  # ci.yml already triggers on every pull request; this now matches it.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          pytest
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web/movrvest-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/movrvest-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The parser fails closed, so a backend field rename would blank
      # the homepage. Until this job existed, no CI step could see it:
      # the frontend suite and build were local gates only.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
